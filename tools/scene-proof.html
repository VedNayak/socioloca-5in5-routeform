<!doctype html>
<html>
  <head>
    <title>Original cargo camera blockout — development only</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ece9e1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
      import {
        createCargoModel,
        createStudioCamera,
      } from "/src/freight/model.ts";
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.append(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#ece9e1");
      const room = new RoomEnvironment();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(room, 0.04).texture;
      const model = createCargoModel();
      if (innerWidth < 821) {
        model.root.scale.setScalar(0.62);
        model.root.position.set(0.4, -2.2, 0);
      }
      scene.add(model.root);
      const camera = createStudioCamera(innerWidth, innerHeight);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbba98d, 2));
      const sun = new THREE.DirectionalLight(0xffecd8, 4);
      sun.position.set(-4, 12, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -20;
      sun.shadow.camera.right = 20;
      sun.shadow.camera.top = 20;
      sun.shadow.camera.bottom = -20;
      scene.add(sun);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: "#ece9e1", roughness: 1 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = innerWidth < 821 ? -4 : 0;
      floor.receiveShadow = true;
      scene.add(floor);
      renderer.render(scene, camera);
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
